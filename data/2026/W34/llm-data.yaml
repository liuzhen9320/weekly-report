title: OAuth2 PKCE lands in the auth service
subtitle: Migrated three repos to OAuth2 PKCE in a 48-hour sprint
overview: >
  This week was dominated by OAuth2 PKCE implementation across three critical repositories. The auth service became the
  central focus, with PRs landing in both internal and third-party systems. The work required deep dives into token
  handling and endpoint security, but the payoff was immediate: our login flow now passes all compliance checks.
  Late-night debugging sessions on cross-origin request issues made for dramatic hours.
summaries:
  - type: repo-summary
    heading: Auth service chaos
    body: OAuth2 PKCE became the week's obsession, requiring PRs in three repos. The opengrok sync PR alone touched 12 files
      while removing 1,804 lines of legacy code.
    chips:
      - label: Repositories
        value: opengrok, auth-service, oauth-provider
        color: default
      - label: PRs merged
        value: "3"
        color: green
  - type: commit-summary
    heading: Commit carnage
    body: 42 total commits with a dramatic spike on deployment day. The Wednesday midnight push that shipped JWT sessions to
      production stands out among the chaos.
    chips:
      - label: Peak commit day
        value: "Wed: 2 commits"
        color: green
      - label: Total commits
        value: "42"
        color: blue
  - type: collaboration-summary
    heading: Solo review spree
    body: Single-handedly reviewed 8 PRs before lunch after our teammate's vacation. Most were trivial, but the auth-related
      ones required extra scrutiny.
    chips:
      - label: PRs reviewed
        value: "8"
        color: purple
      - label: Review speed
        value: 2.1 hrs
        color: orange
